---
layout: default
title: Blog
---

<section>
  <h2>Blog</h2>
  <ul>
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url }}">{{ post.title }}</a>
      <p class="description">
        {{ post.date | date: "%B %-d, %Y" }}{% if post.excerpt %} · {{ post.excerpt | strip_html | truncatewords: 30 }}{% endif %}
      </p>
    </li>
    {% else %}
    <li>
      <p class="description">No posts yet. Check back soon.</p>
    </li>
    {% endfor %}
  </ul>
</section>
